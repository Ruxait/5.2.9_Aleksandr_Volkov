<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      let pathname = window.location.pathname
      let search = window.location.search
      let hash = window.location.hash

      const basename = '/5.2.9_Aleksandr_Volkov'

      let redirectUrl = basename + '/index.html?redirect=' + encodeURIComponent(pathname + search + hash)

      window.location.replace(redirectUrl)
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
